[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-chat"
dynamic = ["version"]
description = "A minimalist terminal chat client for local LLMs, built with zero external dependencies."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ai-chat = "ai_chat.cli:main"

[tool.hatch.version]
path = "src/ai_chat/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_chat"]
