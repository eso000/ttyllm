[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-chat"
dynamic = ["version"]
description = "A terminal chat client for Ollama and OpenAI-compatible servers, standard library only."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Eduard Sorkin" },
]
keywords = ["llm", "chat", "tui", "terminal", "ollama", "openai", "stdlib"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Terminals",
]
dependencies = []

[project.optional-dependencies]
dev = ["black>=26.5,<27", "mypy>=1.11"]

[project.scripts]
ai-chat = "ai_chat.cli:main"

[tool.hatch.version]
path = "src/ai_chat/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_chat"]

[tool.black]
target-version = ["py310"]

[tool.mypy]
files = ["src", "tests"]
mypy_path = "src"
